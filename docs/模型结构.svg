<text x="40" y="466" font-size="17">公平容量对照：下分支输入改为归一化 RGB，辅助网络与分类头完全相同。</text>
<text x="40" y="500" font-size="17">损失：两视图监督 BCE 的平均 + λ(t) × JS 预测一致性；无一致性组 λ=0。</text>
<text x="40" y="533" font-size="14" fill="#536982">结构总参数：融合 2,888,897；单 RGB 2,795,297。图示为方法结构，不表示实验收益已验证。</text>
